<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextChapter — Retirement Planner</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ── Left pane: Chat ─────────────────────────────────────── -->
  <div class="chat-pane">
    <div class="pane-header">
      <span class="logo">NextChapter</span>
      <button class="reset-btn" onclick="resetSession()">New session</button>
    </div>

    <div id="chat-messages" class="messages">
      <div class="msg agent">
        <span>Hi! I'm NextChapter, your retirement planning agent. Ask me something like <em>"Can I retire at 63?"</em> and I'll run a full analysis.</span>
      </div>
    </div>

    <form id="chat-form" class="chat-input-row" onsubmit="sendMessage(event)">
      <input
        id="msg-input"
        type="text"
        placeholder="Can I retire at 63?"
        autocomplete="off"
        autofocus
      >
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <!-- ── Right pane: Dashboard ────────────────────────────────── -->
  <div class="dashboard-pane">
    <div class="pane-header">
      <span>Your Retirement Picture</span>
      <span id="status-badge"></span>
    </div>

    <div id="dashboard-content" class="dashboard-empty">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">No analysis yet</div>
        <div class="empty-sub">Start a conversation to see your retirement picture here.</div>
      </div>
    </div>
  </div>

</div>

<script>
const msgBox   = document.getElementById('chat-messages');
const input    = document.getElementById('msg-input');
const sendBtn  = document.getElementById('send-btn');
const dash     = document.getElementById('dashboard-content');
const badge    = document.getElementById('status-badge');

let _mcChart = null, _ssChart = null;

function destroyCharts() {
  if (_mcChart) { _mcChart.destroy(); _mcChart = null; }
  if (_ssChart) { _ssChart.destroy(); _ssChart = null; }
}

function initCharts(d) {
  const GRID   = '#1c2035';
  const TICK   = '#5a6080';
  const fmt    = v => v >= 1e6 ? `$${(v/1e6).toFixed(1)}M` : v >= 0 ? `$${(v/1000).toFixed(0)}k` : `-$${(-v/1000).toFixed(0)}k`;

  // ── Fan chart ──────────────────────────────────────────────────────────────
  const mcCanvas = document.getElementById('mc-fan-chart');
  if (mcCanvas && d.fan && d.fan.ages.length) {
    if (_mcChart) _mcChart.destroy();
    _mcChart = new Chart(mcCanvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: d.fan.ages,
        datasets: [
          { label: 'Best 10%',  data: d.fan.p90, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.18)',  fill: '+1', tension: 0.35, pointRadius: 0, borderWidth: 1.5 },
          { label: 'Median',    data: d.fan.p50, borderColor: '#60a5fa', backgroundColor: 'rgba(239,68,68,0.12)',  fill: '+1', tension: 0.35, pointRadius: 0, borderWidth: 2   },
          { label: 'Worst 10%', data: d.fan.p10, borderColor: '#ef4444', backgroundColor: 'transparent',           fill: false, tension: 0.35, pointRadius: 0, borderWidth: 1.5 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#c8cdd8', boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } }
        },
        scales: {
          x: { ticks: { color: TICK, maxTicksLimit: 8 }, grid: { color: GRID } },
          y: { ticks: { color: TICK, callback: fmt }, grid: { color: GRID } }
        }
      }
    });
  }

  // ── SS bar chart ───────────────────────────────────────────────────────────
  const ssCanvas = document.getElementById('ss-bar-chart');
  if (ssCanvas && d.ss) {
    if (_ssChart) _ssChart.destroy();
    const colors = d.ss.labels.map((_, i) => i === d.ss.rec ? '#22c55e' : '#3b4a6b');
    const border = d.ss.labels.map((_, i) => i === d.ss.rec ? '#22c55e' : '#4a5880');
    _ssChart = new Chart(ssCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: d.ss.labels,
        datasets: [{ label: 'Monthly Benefit', data: d.ss.monthly, backgroundColor: colors, borderColor: border, borderWidth: 1, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            label: c => `$${c.parsed.y.toLocaleString()}/mo`,
            afterLabel: c => `Portfolio success: ${d.ss.success[c.dataIndex]}%${c.dataIndex === d.ss.rec ? '  ★ Recommended' : ''}`
          }}
        },
        scales: {
          x: { ticks: { color: TICK }, grid: { display: false } },
          y: { ticks: { color: TICK, callback: v => `$${v.toLocaleString()}` }, grid: { color: GRID } }
        }
      }
    });
  }
}

function addMsg(html, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const span = document.createElement('span');
  span.innerHTML = html;
  div.appendChild(span);
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
}

function setStatus(text, cls) {
  badge.textContent = text;
  badge.className = cls ? `status-pill ${cls}` : '';
}

async function sendMessage(e) {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(msg, 'user');
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;
  setStatus('Thinking…', 'thinking');

  const form = new FormData();
  form.append('message', msg);

  try {
    const resp = await fetch('/chat', { method: 'POST', body: form });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      let boundary;
      while ((boundary = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, boundary);
        buf = buf.slice(boundary + 2);
        if (!chunk.trim()) continue;

        let eventType = 'message', data = '';
        for (const line of chunk.split('\n')) {
          if (line.startsWith('event: ')) eventType = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }

        if (eventType === 'chat')      addMsg(data, 'agent');
        if (eventType === 'status')    setStatus('Running analysis…', 'running');
        if (eventType === 'dashboard') {
          destroyCharts();
          dash.classList.remove('dashboard-empty');
          dash.innerHTML = data;
          requestAnimationFrame(() => {
            dash.querySelectorAll('.progress-fill').forEach(el => {
              el.style.width = el.style.getPropertyValue('--fill') || '0%';
            });
          });
          setStatus('', '');
        }
        if (eventType === 'chartdata') {
          try { initCharts(JSON.parse(data)); } catch(e) { console.error('chart init', e); }
        }
      }
    }
  } catch (err) {
    addMsg('Something went wrong — please try again.', 'agent error');
  }

  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
  setStatus('', '');
}

async function resetSession() {
  await fetch('/reset', { method: 'POST' });
  destroyCharts();
  msgBox.innerHTML = `<div class="msg agent"><span>Session reset. Ask me something like <em>"Can I retire at 63?"</em></span></div>`;
  dash.className = 'dashboard-empty';
  dash.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No analysis yet</div><div class="empty-sub">Start a conversation to see your retirement picture here.</div></div>`;
  setStatus('', '');
  input.focus();
}
</script>

</body>
</html>
