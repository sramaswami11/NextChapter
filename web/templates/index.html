<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextChapter — Retirement Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <!-- ── Left pane: Chat ─────────────────────────────────────── -->
  <div class="chat-pane">
    <div class="pane-header">
      <span class="logo">NextChapter</span>
      <button class="reset-btn" onclick="resetSession()">New session</button>
    </div>

    <div id="chat-messages" class="messages">
      <div class="msg agent">
        <span>Hi! I'm NextChapter, your retirement planning agent. Ask me something like <em>"Can I retire at 63?"</em> and I'll run a full analysis.</span>
      </div>
    </div>

    <form id="chat-form" class="chat-input-row" onsubmit="sendMessage(event)">
      <input
        id="msg-input"
        type="text"
        placeholder="Can I retire at 63?"
        autocomplete="off"
        autofocus
      >
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <!-- ── Right pane: Dashboard ────────────────────────────────── -->
  <div class="dashboard-pane">
    <div class="pane-header">
      <span>Your Retirement Picture</span>
      <span id="status-badge"></span>
    </div>

    <div id="dashboard-content" class="dashboard-empty">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">No analysis yet</div>
        <div class="empty-sub">Start a conversation to see your retirement picture here.</div>
      </div>
    </div>
  </div>

</div>

<script>
const msgBox   = document.getElementById('chat-messages');
const input    = document.getElementById('msg-input');
const sendBtn  = document.getElementById('send-btn');
const dash     = document.getElementById('dashboard-content');
const badge    = document.getElementById('status-badge');

function addMsg(html, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const span = document.createElement('span');
  span.innerHTML = html;
  div.appendChild(span);
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
}

function setStatus(text, cls) {
  badge.textContent = text;
  badge.className = cls ? `status-pill ${cls}` : '';
}

async function sendMessage(e) {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;

  addMsg(msg, 'user');
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;
  setStatus('Thinking…', 'thinking');

  const form = new FormData();
  form.append('message', msg);

  try {
    const resp = await fetch('/chat', { method: 'POST', body: form });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      let boundary;
      while ((boundary = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, boundary);
        buf = buf.slice(boundary + 2);
        if (!chunk.trim()) continue;

        let eventType = 'message', data = '';
        for (const line of chunk.split('\n')) {
          if (line.startsWith('event: ')) eventType = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }

        if (eventType === 'chat')      addMsg(data, 'agent');
        if (eventType === 'status')    setStatus('Running analysis…', 'running');
        if (eventType === 'dashboard') {
          dash.classList.remove('dashboard-empty');
          dash.innerHTML = data;
          // Trigger progress bar animation after paint
          requestAnimationFrame(() => {
            dash.querySelectorAll('.progress-fill').forEach(el => {
              el.style.width = el.style.getPropertyValue('--fill') || '0%';
            });
          });
          setStatus('', '');
        }
      }
    }
  } catch (err) {
    addMsg('Something went wrong — please try again.', 'agent error');
  }

  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
  setStatus('', '');
}

async function resetSession() {
  await fetch('/reset', { method: 'POST' });
  msgBox.innerHTML = `<div class="msg agent"><span>Session reset. Ask me something like <em>"Can I retire at 63?"</em></span></div>`;
  dash.className = 'dashboard-empty';
  dash.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No analysis yet</div><div class="empty-sub">Start a conversation to see your retirement picture here.</div></div>`;
  setStatus('', '');
  input.focus();
}
</script>

</body>
</html>
